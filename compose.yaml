services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketflow}
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    ports:
      # bound to localhost only, the database is not exposed to the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

  # the application itself: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # inside the compose network the database is "postgres:5432"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketflow}
      DB_USERNAME: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      # secrets come from .env (see .env.example); if one is empty the application refuses to start
      JWT_SECRET: ${JWT_SECRET:-}
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # the demo web app: static files plus a proxy to the API (http://localhost:5173)
  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
