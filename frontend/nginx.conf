server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the browser only ever talks to this server, so there is no cross-origin call
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # the simulated payment provider (the "Pay" buttons of the demo)
    location /fakepay/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # single-page app: any other path is handled by the router in the browser
    location / {
        try_files $uri /index.html;
    }
}
