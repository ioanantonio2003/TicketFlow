# Local development: values match compose.yaml defaults
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketflow}
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:ticketflow}
  jpa:
    show-sql: true

app:
  jwt:
    # development-only secret, never use it anywhere else
    secret: dev-only-secret-change-me-0123456789abcdef
  admin:
    email: admin@ticketflow.local
    password: admin12345
