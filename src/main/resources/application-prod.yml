# Production: secrets only from environment variables, no defaults
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  payment:
    webhook-secret: ${FAKEPAY_WEBHOOK_SECRET}
    base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  admin:
    # optional: creates the first admin on startup if no admin exists
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# the API documentation is a development tool
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
