spring:
  application:
    name: ticketflow
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    issuer: ticketflow
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  booking:
    hold-duration: 10m
    max-seats-per-event: 6
    # how often expired holds are released, and how many orders one transaction handles
    expiry-check-interval: 30s
    expiry-batch-size: 100

server:
  shutdown: graceful

logging:
  pattern:
    # requestId is put in the MDC by RequestIdFilter
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
