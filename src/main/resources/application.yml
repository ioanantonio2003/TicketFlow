spring:
  mail:
    # Mailpit in development (compose.yaml); production sets MAIL_HOST / MAIL_PORT
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  application:
    name: ticketflow
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    issuer: ticketflow
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  booking:
    hold-duration: 10m
    max-seats-per-event: 6
    # how often expired holds are released, and how many orders one transaction handles
    expiry-check-interval: 30s
    expiry-batch-size: 100
    # a paid order can be refunded until this long before the event starts
    refund-deadline: 24h

  notification:
    from: noreply@ticketflow.local
    enabled: true
  payment:
    # where the simulated provider is reachable (it runs inside this same application) and the shared secret
    # used to sign its webhooks; the secret is set per profile
    base-url: http://localhost:8080
    webhook-tolerance: 5m

server:
  shutdown: graceful

logging:
  pattern:
    # requestId is put in the MDC by RequestIdFilter
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
