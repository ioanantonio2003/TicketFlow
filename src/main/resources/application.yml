spring:
  application:
    name: ticketflow
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    issuer: ticketflow
    access-token-ttl: 15m

server:
  shutdown: graceful

logging:
  pattern:
    # requestId is put in the MDC by RequestIdFilter
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
