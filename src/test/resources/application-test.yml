# The datasource comes from the Testcontainers PostgreSQL container (@ServiceConnection)
spring:
  jpa:
    show-sql: false

app:
  notification:
    # tests that look at emails switch it on and use a capturing mail sender
    enabled: false
  booking:
    # the job never fires during tests; they call the service directly
    expiry-check-interval: 1h
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789
  payment:
    webhook-secret: test-only-fakepay-secret-0123456789
  admin:
    email: admin@test.local
    password: admin-test-password
